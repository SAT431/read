name: folio
services:
  api:
    build:
      context: ../..
      dockerfile: service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FOLIO_DATA_ROOT: /app/data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - folio_data:/app/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      FOLIO_HOST: ${FOLIO_HOST:?Set FOLIO_HOST in the private .env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  folio_data:
  caddy_data:
  caddy_config:
